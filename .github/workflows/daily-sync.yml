name: Daily GitHub Tool Radar Sync

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum repositories to classify per run"
        required: false
        default: "25"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SYNC_LIMIT: ${{ github.event.inputs.limit || '20' }}
